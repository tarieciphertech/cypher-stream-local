name: LAN Stack Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate Compose configuration
        run: |
          cp .env.lan.example .env.lan
          docker compose --env-file .env.lan -f docker-compose.lan.yml config

      - name: Validate LAN Nginx configuration
        run: |
          sed 's#http://api:3000#http://127.0.0.1:3000#; s#http://web#http://127.0.0.1:8081#' deploy/nginx/lan.conf > /tmp/lan.conf
          docker run --rm -v "/tmp/lan.conf:/etc/nginx/conf.d/default.conf:ro" nginx:1.29-alpine nginx -t

      - name: Validate local database schema
        run: |
          docker run --rm -v "$PWD/docker/postgres/init:/init:ro" postgres:16-alpine             bash -lc "cat /init/001-local-schema.sql >/dev/null && grep -q 'local_users' /init/001-local-schema.sql"

      - name: Build web image
        run: docker compose --env-file .env.lan -f docker-compose.lan.yml build web

      - name: Build API image
        run: docker compose --env-file .env.lan -f docker-compose.lan.yml build api
