name: Native LAN Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@10.12.1 --activate

      - name: Install PostgreSQL and FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql postgresql-client ffmpeg
          sudo systemctl start postgresql
          sudo -u postgres psql -c "CREATE USER cypher_stream PASSWORD 'test-password';"
          sudo -u postgres createdb -O cypher_stream cypher_stream_local

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build frontend
        run: pnpm --filter @workspace/cypher-stream run build
        env:
          PORT: 8080
          BASE_PATH: /
          VITE_API_URL: /api
          VITE_MEDIA_BASE_URL: /media

      - name: Build API
        run: pnpm --filter @workspace/api-server run build

      - name: Validate local schema
        env:
          PGPASSWORD: test-password
        run: psql -h 127.0.0.1 -U cypher_stream -d cypher_stream_local -f deploy/postgres/001-local-schema.sql

      - name: Verify native server entrypoint
        run: |
          grep -q 'express.static' artifacts/api-server/src/app.ts
          grep -q 'MEDIA_ROOT' artifacts/api-server/src/app.ts
          grep -q 'WEB_DIST_DIR' artifacts/api-server/src/app.ts
