name: Bootstrap Cypher-Stream Local

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: tarieciphertech/Cypher-Stream
          ref: main
          path: source
      - name: Copy source without deleting LAN files
        run: |
          rsync -a --exclude='.git' source/ ./
          rm -rf source
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Bootstrap Cypher-Stream Local" || exit 0
          git push origin HEAD:main
